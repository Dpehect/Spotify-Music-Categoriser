[project]
name = "spotify-music-categoriser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "langdetect>=1.0.9",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.6.0",
    "requests>=2.31.0",
    "spotipy>=2.24.0",
    "syncedlyrics>=1.0.0",
    "urllib3<2",
    "uvicorn>=0.28.0",
]

[tool.vercel]
entrypoint = "web_app:app"
